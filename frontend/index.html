<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django API + JS Async/Await Demo</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            background: #f4f4f9; 
            color: #333; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            max-width: 500px; 
        }
        #api-content { 
            margin-top: 15px; 
            padding: 10px; 
            background: #eee; 
            border-left: 5px solid #007bff; 
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Django + JavaScript Connection</h2>
        <p id="status-message">Initializing script...</p>
        <div id="api-content">Waiting for data stream...</div>
    </div>

    <!-- This script tag hooks up our asynchronous JavaScript logic file -->
    <script src="app.js"></script>
</body>
</html>
